<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; connect-src https://lkuhoyeeylileuuavukj.supabase.co; form-action https://lkuhoyeeylileuuavukj.supabase.co; base-uri 'none'; frame-ancestors 'none'" />
<meta name="robots" content="noindex,nofollow" />
<title>Quote for approval</title>
<style>
:root{color-scheme:light;--ink:#10203a;--muted:#637083;--blue:#1264d8;--paper:#fff;--wash:#f3f7fc;--line:#dfe7f1;--green:#16794b;--red:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:760px;margin:auto;padding:28px 18px 48px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px #17365d14;overflow:hidden}.hero{padding:30px;background:linear-gradient(135deg,#0d4ca8,#1685df);color:white}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:14px 0 8px}.hero p{margin:0;opacity:.88}.content{padding:26px}table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:15px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}td:last-child,th:last-child{text-align:right}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding-top:12px}.actions{display:grid;gap:12px;margin:22px 0}label{display:grid;gap:6px;font-weight:650}input{width:100%;max-width:420px;border:1px solid #bdc9d8;border-radius:10px;padding:12px;font:inherit}.button,button{appearance:none;border:0;border-radius:12px;padding:13px 18px;color:white;text-decoration:none;font:inherit;font-weight:700;cursor:pointer;width:100%}.primary{background:var(--green)}.secondary{background:#e9f2ff;color:#064fae}.fine{color:var(--muted);font-size:13px}.decision{display:flex;gap:14px;align-items:center;padding:18px;border-radius:16px;border:1px solid var(--line)}.decision.approved{background:#edf9f2;border-color:#b9e4ca;color:#125d3b}.decision.declined{background:#fdecea;border-color:#f3c1bc;color:var(--red)}.seal{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;color:white;font-size:22px}.approved .seal{background:var(--green)}.declined .seal{background:var(--red)}.contact{margin-top:18px;color:var(--muted);font-size:14px}.expiry{color:var(--muted);font-size:13px;margin-top:18px}.state{padding:60px 20px;text-align:center;color:var(--muted)}@media(max-width:650px){.wrap{padding:0}.card{border:0;border-radius:0}.hero,.content{padding:24px}}
</style>
</head>
<body>
<main class="wrap"><article class="card" id="app"><div class="state">Loading…</div></article></main>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var FN = "https://lkuhoyeeylileuuavukj.supabase.co/functions/v1/quote-approval";
  var token = new URLSearchParams(location.search).get("t") || "";
  var esc = function (value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var longDate = function (iso) {
    try { return new Date(iso).toLocaleDateString("en", { dateStyle: "long" }); }
    catch (e) { return ""; }
  };
  var symbols = { USD: "$", GBP: "£", EUR: "€", PKR: "Rs ", INR: "₹", AUD: "A$", CAD: "C$" };
  var money = function (value, code) {
    return (symbols[code] || (code ? code + " " : "")) +
      Number(value).toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };
  var fail = function (message) {
    app.innerHTML = '<div class="state">' + esc(message) + "</div>";
  };

  if (!token || token.length < 32) { fail("This approval link is unavailable or has expired."); return; }

  fetch(FN + "?token=" + encodeURIComponent(token) + "&format=json")
    .then(function (response) { if (!response.ok) throw new Error("unavailable"); return response.json(); })
    .then(function (share) {
      var contact = share.business_email
        ? '<a href="mailto:' + encodeURIComponent(share.business_email) + '">' + esc(share.business_email) + "</a>"
        : share.business_phone
        ? '<a href="tel:' + esc(String(share.business_phone).replace(/[^+0-9]/g, "")) + '">' + esc(share.business_phone) + "</a>"
        : "Contact " + esc(share.business_name) + ".";
      var decision = share.status !== "pending"
        ? '<div class="decision ' + share.status + '"><span class="seal">' + (share.status === "approved" ? "✓" : "✕") +
          "</span><div><strong>Quote " + esc(share.status) + " by " + esc(share.decided_by_name || "the client") +
          "</strong><br /><small>" + esc(share.decided_at ? longDate(share.decided_at) : "") + "</small></div></div>"
        : '<div class="actions">' +
          '<form method="post" action="' + esc(share.decide_base + "approve") + '">' +
          '<label>Your name<input name="decided_by_name" required="required" maxlength="120" autocomplete="name" /></label>' +
          '<button type="submit" class="primary">Approve this quote</button></form>' +
          '<form method="post" action="' + esc(share.decide_base + "decline") + '">' +
          '<button type="submit" class="secondary">Decline</button></form></div>' +
          '<p class="fine">Your choice is recorded once and sent to ' + esc(share.business_name) +
          ". CrewFlow records the name entered above; it does not independently verify identity.</p>";
      var rows = (share.items || []).map(function (item) {
        return "<tr><td>" + esc(item.name) + "</td><td>" + esc(item.quantity) + "</td><td>" +
          money(item.unitPrice, share.currency_code) + "</td><td>" +
          money(item.quantity * item.unitPrice, share.currency_code) + "</td></tr>";
      }).join("");

      document.title = share.quote_title + " — quote from " + share.business_name;
      app.innerHTML =
        '<header class="hero"><div class="eyebrow">Quote for approval</div><h1>' + esc(share.quote_title) +
        "</h1><p>Prepared for " + esc(share.client_name) + " by " + esc(share.business_name) +
        (share.business_trade ? " · " + esc(share.business_trade) : "") + "</p></header>" +
        '<div class="content"><table><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Amount</th></tr></thead><tbody>' +
        rows + '</tbody></table><div class="total"><span>Total</span><span>' +
        money(share.total, share.currency_code) + "</span></div>" + decision +
        '<p class="contact">Questions about this quote? ' + contact + "</p>" +
        '<p class="expiry">This link expires ' + esc(longDate(share.expires_at)) + ".</p></div>";
    })
    .catch(function () { fail("This approval link is unavailable or has expired."); });
})();
</script>
</body>
</html>
